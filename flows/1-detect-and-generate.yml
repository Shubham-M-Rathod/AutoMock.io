id: automock-detect-and-generate
namespace: automock

# ─────────────────────────────────────────────
# FLOW 1: Triggered when someone pushes to the backend repo.
# Checks if openapi.yml changed → generates mocks with MINIMAL changes
# (preserving unaffected fields like firstName) → opens a Draft PR
# in the frontend repo → notifies the repo owner.
# ─────────────────────────────────────────────

description: |
  Detects openapi.yml changes in the backend repo on push,
  generates mock data with minimum change preservation,
  and opens a PR in the frontend repo.

labels:
  project: automock
  team: platform

triggers:
  - id: backend-push-webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: backend-push

inputs:
  - id: ref
    type: STRING
    description: "Branch ref that was pushed (e.g. refs/heads/main)"
    defaults: "refs/heads/main"
  - id: frontend_branch
    type: STRING
    description: "Target frontend base branch"
    defaults: "main"
  - id: force
    type: BOOL
    description: "Force regeneration even if openapi.yml SHA is unchanged"
    defaults: false

variables:
  # ── Repo details ──
  backend_repo_owner: "Shubham-M-Rathod"
  backend_repo_name: "mockBackend"
  frontend_repo_owner: "Shubham-M-Rathod"
  frontend_repo_name: "mockFrontend"

  # Path inside backend repo where openapi spec lives
  openapi_path: "openapi.yml"

  # KV store key used to track the last known openapi.yml SHA
  kv_openapi_hash_key: "automock.last_openapi_sha"

tasks:

  # ── Step 1: Get latest commit SHA for openapi.yml on backend ──
  - id: get-openapi-file-info
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/{{ vars.backend_repo_owner }}/{{ vars.backend_repo_name }}/contents/{{ vars.openapi_path }}"
    method: GET
    headers:
      Authorization: "Bearer {{ envs.github_token }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"

  # ── Step 1b: Log GitHub API response for easy debugging ──
  - id: log-github-response
    type: io.kestra.plugin.core.log.Log
    message: "GitHub API response: HTTP {{ outputs['get-openapi-file-info'].code }} -> {{ outputs['get-openapi-file-info'].body }}"

  # ── Step 2: Retrieve previously stored SHA from Kestra KV store ──
  - id: get-last-known-sha
    type: io.kestra.plugin.core.kv.Get
    key: "{{ vars.kv_openapi_hash_key }}"
    namespace: automock
    errorOnMissing: false

  # ── Step 3: Compare SHAs — skip if unchanged or request failed ──
  - id: check-if-changed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.force == true or (outputs['get-openapi-file-info'].code == 200 and fromJson(outputs['get-openapi-file-info'].body).sha != (outputs['get-last-known-sha'].value ?? '')) }}"
    then:

      # ── Step 4a: Download raw openapi.yml content ──
      - id: download-openapi
        type: io.kestra.plugin.core.http.Request
        uri: "{{ fromJson(outputs['get-openapi-file-info'].body).download_url }}"
        method: GET
        headers:
          Authorization: "Bearer {{ envs.github_token }}"

      # ── Step 4b: Get frontend base branch SHA (required to branch from) ──
      - id: get-frontend-base-sha
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ vars.frontend_repo_owner }}/{{ vars.frontend_repo_name }}/git/ref/heads/{{ inputs.frontend_branch }}"
        method: GET
        headers:
          Authorization: "Bearer {{ envs.github_token }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"

      # ── Step 4c: Create a new branch in frontend repo from the base branch ──
      - id: create-frontend-branch
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ vars.frontend_repo_owner }}/{{ vars.frontend_repo_name }}/git/refs"
        method: POST
        headers:
          Authorization: "Bearer {{ envs.github_token }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        contentType: application/json
        body: |
          {
            "ref": "refs/heads/automock/update-mocks-{{ execution.id }}",
            "sha": "{{ fromJson(outputs['get-frontend-base-sha'].body).object.sha }}"
          }

      # ── Step 4d: Generate mock data with smart preservation & push to branch ──
      - id: generate-mocks
        type: io.kestra.plugin.scripts.shell.Script
        containerImage: node:20-alpine
        beforeCommands:
          - npm install js-yaml json-schema-faker@0.5.9 @faker-js/faker
        env:
          GITHUB_TOKEN: "{{ envs.github_token }}"
          FRONTEND_REPO_OWNER: "{{ vars.frontend_repo_owner }}"
          FRONTEND_REPO_NAME: "{{ vars.frontend_repo_name }}"
          FRONTEND_DEFAULT_BRANCH: "{{ inputs.frontend_branch }}"
          TARGET_BRANCH: "automock/update-mocks-{{ execution.id }}"
        inputFiles:
          openapi.yml: "{{ outputs['download-openapi'].body }}"
          generate-mocks.mjs: "{{ read('scripts/generate-mocks.mjs') }}"
        script: |
          node generate-mocks.mjs
        outputFiles:
          - "mocks/**"

      # ── Step 4e: Open a Draft PR in frontend repo against base branch ──
      - id: create-frontend-pr
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ vars.frontend_repo_owner }}/{{ vars.frontend_repo_name }}/pulls"
        method: POST
        headers:
          Authorization: "Bearer {{ envs.github_token }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        contentType: application/json
        body: |
          {
            "title": "🤖 [AutoMock] Update mocks — openapi.yml changed in backend",
            "body": "## What happened?\n\nThe `openapi.yml` in the backend repo was updated. AutoMock has generated updated mock data for the frontend.\n\n### 🎯 Smart Diff (Minimum Changes Applied)\n- **Unaffected fields (e.g. `firstName`) were preserved** from existing mocks so existing tests and fixtures won't break.\n- Only newly added or modified fields were generated.\n\n## What to do\n1. Review the diff in `mocks/` (notice only changed fields were touched)\n2. Ensure your component unit tests pass\n3. Merge this PR when ready\n\n> **Draft PR** — non-blocking heads-up to keep frontend in sync early.\n\n### Execution ID\n`{{ execution.id }}`\n\n---\n*Generated by [AutoMock](http://localhost:8080) via Kestra*",
            "head": "automock/update-mocks-{{ execution.id }}",
            "base": "{{ inputs.frontend_branch }}",
            "draft": true
          }

      # ── Step 4f: Notify repo owner (not all contributors) ──
      - id: notify-owner
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/{{ vars.frontend_repo_owner }}/{{ vars.frontend_repo_name }}/issues"
        method: POST
        headers:
          Authorization: "Bearer {{ envs.github_token }}"
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
        contentType: application/json
        body: |
          {
            "title": "⚠️ openapi.yml updated — frontend mocks need a review",
            "body": "Hi @{{ vars.frontend_repo_owner }} 👋\n\nThe backend `openapi.yml` was updated. AutoMock has opened a draft PR with minimal mock updates in `mocks/` (preserving existing unaffected fields):\n\n**PR**: {{ fromJson(outputs['create-frontend-pr'].body).html_url }}\n\nNo urgency — this is an early heads-up so the team isn't surprised.\n\n_This issue was auto-created by AutoMock. Close it once the mock PR is merged._",
            "labels": ["automock", "needs-review"],
            "assignees": ["{{ vars.frontend_repo_owner }}"]
          }

      # ── Step 4g: Now that PR succeeded, store new SHA in KV store ──
      - id: store-new-sha
        type: io.kestra.plugin.core.kv.Set
        key: "{{ vars.kv_openapi_hash_key }}"
        namespace: automock
        value: "{{ fromJson(outputs['get-openapi-file-info'].body).sha }}"

    else:
      - id: log-no-change
        type: io.kestra.plugin.core.log.Log
        message: "Skipped: openapi.yml unchanged or GitHub request returned HTTP {{ outputs['get-openapi-file-info'].code }}."
        level: INFO
